name: application validation

on:
    
    push:
        branches:
            - main
    
    pull_request:
        branches:
            - main
        types:
        - opened
        - reopened
        - synchronize

    workflow_dispatch:            

            

jobs:
    validate-application:
        runs-on: ubuntu-latest

        steps:
            
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: '24.x'

            - name: display file
              run: ls -la
            
            - name: Install Dependencies
              run: npm ci
            
            - name: Run Unit Tests
              run: npm run test   

            - name: Display workflow trigger
              run: 'echo "Workflow triggered by: ${{ github.event_name }}"'
  

            
